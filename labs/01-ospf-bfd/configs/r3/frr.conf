frr version 9.1
frr defaults traditional
hostname r3
!
interface lo
 ip address 10.0.0.3/32
!
interface eth1
 ip address 10.1.13.3/24
 ip ospf bfd
 ip ospf network point-to-point
!
interface eth2
 ip address 10.1.23.3/24
 ip ospf bfd
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.0.0.3
 network 10.0.0.3/32 area 0
 network 10.1.13.0/24 area 0
 network 10.1.23.0/24 area 0
!
line vty
